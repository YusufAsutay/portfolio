# =====================================================================
# Derle ve "yayin" dalına koy
#
# main dalına her gönderimde (git push) GitHub'ın sunucularında çalışır:
#   1) kodu indirir  2) Node.js kurar  3) siteyi derler (dist/)
#   4) dist/ içeriğini "yayin" dalına koyar
#
# Kendi sunucumuz derleme yapmaz; scripts/deploy.sh yalnızca "yayin"
# dalındaki hazır dosyaları çekip yayın klasörüne kopyalar.
# (Sebep: sunucunun sanal işlemcisi, derleme araçlarının kullandığı bazı
#  işlemci komutlarını desteklemiyor → "Illegal instruction" hatası.)
#
# Çalışmaları GitHub'da deponun "Actions" sekmesinden izleyebilirsin.
# =====================================================================
name: Derle ve yayın dalına koy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle de başlatılabilsin

# "yayin" dalına yazabilmek için deponun içeriğine yazma izni
permissions:
  contents: write

# Art arda iki push gelirse eskisinin derlemesini iptal et, sadece en yenisi kalsın
concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Node.js kur (bilgisayardakiyle aynı ana sürüm)
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Siteyi derle
        run: npm run build

      - name: dist/ klasörünü "yayin" dalına gönder
        working-directory: dist
        run: |
          git init -q -b yayin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Derleme: ${GITHUB_SHA::7}"
          # -f: dal her seferinde en yeni derlemeyle baştan yazılır (geçmiş tutulmaz)
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" yayin
